name: Docker Publish

# Builds and pushes ghcr.io/kieksme/enhancv-mcp (linux/amd64 + linux/arm64) for an existing release tag.
# Started by release-please.yml after a release; can also be run manually to rebuild a tag.
# A new GHCR package is private at first: make it public once under Packages > enhancv-mcp > Package settings.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example 0.1.0)
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/enhancv-mcp

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Tag matches package.json version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then echo "Tag $TAG does not match package.json version $VERSION"; exit 1; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest

      # Never publish an image that does not start: build for the runner, run it, check health and authentication.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: enhancv-mcp:smoke
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:3010:3000 \
            -e ENHANCV_API_KEY=enh_live_smoke_placeholder -e MCP_HTTP_AUTH_TOKEN=smoke-token enhancv-mcp:smoke
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3010/mcp)" = 401

      - name: Build and push (multi-arch, with provenance and SBOM)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
