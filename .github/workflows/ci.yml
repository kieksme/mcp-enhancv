name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test # unit tests and the evaluation reference solutions
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm pack:check
      - run: pnpm smoke:dist

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enhancv-mcp:ci .
      - name: HTTP mode starts, is healthy and rejects unauthenticated calls
        run: |
          docker run -d --name enhancv-mcp-ci -p 127.0.0.1:3010:3000 \
            -e ENHANCV_API_KEY=enh_live_ci_placeholder -e MCP_HTTP_AUTH_TOKEN=ci-token \
            enhancv-mcp:ci
          trap 'docker logs enhancv-mcp-ci; docker rm -f enhancv-mcp-ci' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3010/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:3010/health)" = 403
          test "$(docker exec enhancv-mcp-ci id -u)" != 0
      - name: stdio mode answers the MCP handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --rm -e MCP_TRANSPORT=stdio -e ENHANCV_API_KEY=enh_live_ci_placeholder enhancv-mcp:ci \
            | grep -q '"enhancv-mcp-server"'
